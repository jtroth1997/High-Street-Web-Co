name: Update TC photo upload flow
on:
  push:
    paths:
      - '.github/workflows/update-tc-photo-upload.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Tilers Community pages
        run: python scripts/update_tc_photos.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tilers-community.html tilers-community-thank-you.html
          git commit -m 'Attach Tilers Community project photos to brief'
          git push
